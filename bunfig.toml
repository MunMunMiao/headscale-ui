[run]
bun = true

[lint]
typeAware = true
ignorePatterns = ["reports/**"]
plugins = ["typescript", "unicorn", "oxc", "import"]

[lint.rules]
# Bun defaults (ESLint/TS recommended, React hooks, core test rules) plus project rules.

"@typescript-eslint/consistent-type-assertions" = [
  "error",
  { assertionStyle = "never" },
]
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-non-null-assertion" = "error"
"@typescript-eslint/consistent-type-imports" = "error"
"@typescript-eslint/no-import-type-side-effects" = "error"
"@typescript-eslint/no-extraneous-class" = [
  "error",
  { allowConstructorOnly = true },
]
"@typescript-eslint/unbound-method" = "error"
"@typescript-eslint/no-floating-promises" = "error"
"@typescript-eslint/await-thenable" = "error"
"@typescript-eslint/consistent-return" = "error"
"@typescript-eslint/restrict-template-expressions" = "error"
"@typescript-eslint/no-unnecessary-type-conversion" = "error"
"@typescript-eslint/no-redundant-type-constituents" = "error"
"@typescript-eslint/require-array-sort-compare" = "error"
"@typescript-eslint/no-unnecessary-type-parameters" = "error"
"@typescript-eslint/no-base-to-string" = "error"
"@typescript-eslint/no-unnecessary-boolean-literal-compare" = "error"
"@typescript-eslint/no-meaningless-void-operator" = "error"

"eqeqeq" = ["error", "always", { null = "ignore" }]
"no-param-reassign" = "error"
"unicorn/prefer-structured-clone" = "error"
"no-await-in-loop" = "off"
"unicorn/consistent-function-scoping" = "off"
"unicorn/require-post-message-target-origin" = "off"
"unicorn/prefer-add-event-listener" = "off"
"oxc/no-map-spread" = "off"
"no-underscore-dangle" = [
  "error",
  { allow = ["_getBlockers", "_option", "__resetForTest"] },
]
"import/no-unassigned-import" = "off"
"import/no-cycle" = "error"
"no-restricted-properties" = [
  "error",
  { object = "Object", property = "assign", message = "Use object spread instead of Object.assign." },
  { object = "Object", property = "defineProperty", message = "Define the value where it is created, or use vi.stubGlobal in tests." },
  { object = "Object", property = "defineProperties", message = "Define the values where they are created, or use vi.stubGlobal in tests." },
  { object = "Object", property = "create", message = "Use an object literal or a Map instead of Object.create." },
  { object = "Object", property = "setPrototypeOf", message = "Do not change an object's prototype." },
  { object = "Object", property = "freeze", message = "Keep immutability in types instead of freezing at runtime." },
  { object = "Object", property = "seal", message = "Do not lock objects at runtime." },
  { object = "Object", property = "preventExtensions", message = "Do not lock objects at runtime." },
  { object = "Object", property = "getOwnPropertyDescriptor", message = "Use a typed fixture or vi.stubGlobal instead of reading a property descriptor." },
]

[[lint.overrides]]
files = ["src/session/operation-dispatch.ts"]
[lint.overrides.rules]
"import/namespace" = "off"

[[lint.overrides]]
files = ["src/components/ui/**"]
[lint.overrides.rules]
"no-shadow" = "off"

[[lint.overrides]]
files = ["**/*.d.ts"]
[lint.overrides.rules]
"no-underscore-dangle" = "off"

[[lint.overrides]]
files = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.browser.test.ts",
  "**/*.browser.test.tsx",
  "e2e/**",
  "scripts/**",
  "src/test/**",
  "src/test-utils/**",
  "vitest*.config.ts",
]
[lint.overrides.rules]
# Test fixtures read untyped JSON, DOM and browser internals; production keeps these rules.
"@typescript-eslint/no-unsafe-assignment" = "off"
"@typescript-eslint/no-unsafe-member-access" = "off"
"@typescript-eslint/no-unsafe-argument" = "off"
"@typescript-eslint/no-unsafe-return" = "off"
"@typescript-eslint/no-unsafe-call" = "off"
"@typescript-eslint/require-await" = "off"
"@typescript-eslint/prefer-promise-reject-errors" = "off"
"@typescript-eslint/only-throw-error" = "off"
"@typescript-eslint/no-misused-promises" = "off"

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/headscale-ui;
    index index.html;
    absolute_redirect off;

    # nginx does not inherit add_header into a nested block that sets its own, so every header
    # is declared once here and the blocks below only vary the variables. An empty value is omitted.
    set $csp_connect "'self'";
    set $cache_control "";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src $csp_connect; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cache_control;

    ${BASE_REDIRECT}
    ${BASE_FALLBACK}

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        font/woff2;

    location = ${BASE_PATH}index.html {
        set $cache_control "no-cache";
    }

    location = ${BASE_PATH}favicon.svg {
        try_files $uri =404;
    }

    location = ${BASE_PATH}shared-session-worker.js {
        # The Worker response CSP governs its own fetches, and users supply the Headscale URL.
        set $csp_connect "http: https:";
        set $cache_control "no-cache";
        try_files $uri =404;
    }

    location ${BASE_PATH}assets/ {
        set $cache_control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ${BASE_PATH} {
        try_files $uri $uri/ ${BASE_PATH}index.html;
    }
}

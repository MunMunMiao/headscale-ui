server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/headscale-ui;
    index index.html;
    absolute_redirect off;

    ${BASE_REDIRECT}
    ${BASE_FALLBACK}

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        font/woff2;

    location = ${BASE_PATH}index.html {
        add_header Cache-Control "no-cache";
    }

    location = ${BASE_PATH}favicon.svg {
        try_files $uri =404;
    }

    location ${BASE_PATH}assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ${BASE_PATH} {
        try_files $uri $uri/ ${BASE_PATH}index.html;
    }
}

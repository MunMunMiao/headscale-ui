name: CI
"on":
  pull_request: null
  push: null
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run browser:install
      - run: bun run --parallel lint typecheck
      - run: bun run i18n:check
      - run: bun run test
      - run: bun run build
  e2e:
    needs: test
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run browser:install
      - run: bun run e2e
